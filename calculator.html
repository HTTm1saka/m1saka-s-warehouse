<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>HTML5 计算器 · 函数绘图</title>
<style>
:root{
  --bg:#0e1320; --panel:#171f31; --panel2:#202b44; --input:#0b1120;
  --text:#e7edf8; --dim:#8d9bbd; --accent:#5b8cff; --accent2:#7b5cf0;
  --danger:#ff6b6b; --line:#26334f; --radius:14px;
  --mono:Consolas,"Cascadia Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(1100px 700px at 85% -10%, #1c2a4e 0%, transparent 60%),
    var(--bg);
  color:var(--text); min-height:100vh; padding:22px 20px 40px;
}
header{max-width:1120px;margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
h1{font-size:19px;font-weight:650;letter-spacing:.4px}
h1 small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.tab{border:0;background:transparent;color:var(--dim);padding:8px 20px;border-radius:999px;cursor:pointer;font-size:13.5px;font-family:inherit;transition:.18s}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
main{max-width:1120px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}

/* ---------- 计算器 ---------- */
.calc-wrap{display:grid;grid-template-columns:minmax(0,430px) 1fr;gap:18px;align-items:start}
@media(max-width:880px){.calc-wrap{grid-template-columns:1fr}}
.calc-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.display{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:14px;text-align:right;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.expr{color:var(--dim);font-size:14px;min-height:19px;word-break:break-all;font-family:var(--mono)}
.result{font-size:33px;font-weight:650;font-family:var(--mono);margin-top:5px;word-break:break-all;line-height:1.2}
.result.preview{color:var(--dim);font-weight:400;font-size:21px}
.result.error{color:var(--danger);font-size:17px;font-weight:500}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.key{border:0;border-radius:9px;padding:13px 0;font-size:16px;color:var(--text);background:var(--panel2);cursor:pointer;font-family:inherit;transition:filter .12s,transform .05s;user-select:none;touch-action:manipulation}
.key:hover{filter:brightness(1.28)}
.key:active{transform:scale(.94)}
.key.fn{background:#1d2b4a;color:#a7c3f6;font-size:13.5px}
.key.op{background:#24395f;color:#d3e2ff}
.key.warn{color:#ffb3b3}
.key.eq{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:20px;grid-row:span 2}
.key.unit{grid-column:span 5;background:#1a2340;color:var(--dim);font-size:12.5px;letter-spacing:1px}
.calc-tip{color:var(--dim);font-size:12px;line-height:1.9;margin-top:16px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.calc-tip b{color:#9fc0ff;font-weight:500}
.calc-tip code{font-family:var(--mono);background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:11.5px}

/* ---------- 函数绘图 ---------- */
.plot-layout{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media(max-width:880px){.plot-layout{grid-template-columns:1fr}}
.fn-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;height:fit-content}
.fn-head{font-size:12.5px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase}
.fn-item{display:flex;flex-direction:column;gap:5px}
.fn-row{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.fn-eq{color:var(--dim);font-size:13px;flex:none;font-family:var(--mono)}
.fn-row input{flex:1;min-width:0;background:var(--input);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:8px 10px;font-family:var(--mono);font-size:13.5px;outline:none}
.fn-row input:focus{border-color:var(--accent)}
.fn-row input.invalid{border-color:var(--danger)}
.fn-err{display:none;color:var(--danger);font-size:12px;padding-left:22px;line-height:1.4}
.del{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:14px;padding:3px 5px;flex:none}
.del:hover{color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 10px;cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
.btn:hover{border-color:var(--accent);color:#cfe0ff}
.btn:disabled{opacity:.35;cursor:default}
.btn.grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--input);color:var(--dim);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;font-family:var(--mono);transition:.15s}
.chip:hover{color:var(--text);border-color:var(--accent);background:var(--panel2)}
.toolbar{display:flex;gap:8px}
.canvas-wrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;height:clamp(440px,68vh,700px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:rgba(10,15,28,.94);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12px;font-family:var(--mono);line-height:1.8;display:none;white-space:nowrap;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip .t-color{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.help{color:var(--dim);font-size:12px;line-height:1.9}
.help b{color:#9fc0ff;font-weight:500}
</style>
</head>
<body>

<header>
  <h1>🧮 HTML5 计算器<small>科学计算 · 函数绘图</small></h1>
  <nav class="tabs">
    <button class="tab active" data-tab="calc">计算器</button>
    <button class="tab" data-tab="plot">函数图像</button>
  </nav>
</header>

<main>
  <!-- ============ 计算器 ============ -->
  <section id="calc" class="panel active">
    <div class="calc-wrap">
      <div class="calc-card">
        <div class="display">
          <div class="expr" id="expr"></div>
          <div class="result" id="result">0</div>
        </div>
        <div class="keys" id="keys"></div>
      </div>
      <div class="calc-tip">
        <b>用法：</b>点击按钮或直接键盘输入。<br>
        支持 <code>sin cos tan asin … ln log lg sqrt cbrt abs exp e^x</code> 等函数，<code>^</code> 幂运算、<code>%</code> 百分号、隐式乘法（如 <code>2x</code>、<code>2sin(x)</code>）。<br>
        常量 <code>π</code>、<code>e</code>；<code>Ans</code> 引用上次结果。<br>
        键盘：<code>Enter</code> 计算 · <code>Esc</code> 清空 · <code>Backspace</code> 退格。
      </div>
    </div>
  </section>

  <!-- ============ 函数绘图 ============ -->
  <section id="plot" class="panel">
    <div class="plot-layout">
      <aside class="fn-panel">
        <div class="fn-head">函数列表</div>
        <div id="fnList" style="display:flex;flex-direction:column;gap:9px"></div>
        <button id="addFn" class="btn">＋ 添加函数</button>
        <div class="fn-head">示例</div>
        <div class="chips" id="chips"></div>
        <div class="toolbar">
          <button id="resetView" class="btn grow" title="双击画布同样复位">⌂ 复位视图</button>
          <button id="zoomIn" class="btn" title="放大">＋</button>
          <button id="zoomOut" class="btn" title="缩小">－</button>
        </div>
        <div class="help">
          拖拽平移 · 滚轮 / 双指缩放 · 悬停读数<br>
          <b>自变量为 x</b>，三角函数统一使用<b>弧度制</b>。<br>
          deg（角度）只影响「计算器」页签。
        </div>
      </aside>
      <div class="canvas-wrap" id="wrap">
        <canvas id="cv"></canvas>
        <div class="tip" id="tip"></div>
      </div>
    </div>
  </section>
</main>

<script>
'use strict';
/* =====================================================================
 * 表达式引擎：词法分析 → 递归下降语法分析 → 编译为闭包（不使用 eval）
 *
 * 文法（优先级由低到高）：
 *   add  : term (('+'|'-') term)*
 *   term : unary (( '*'|'/') unary | 隐式乘法 unary)*
 *   unary: ('-'|'+'|'√') unary  |  power
 *   power: postfix ('^' unary)?            （右结合，支持 2^-3）
 *   postfix: atom '%'*
 *   atom : 数字 | '(' add ')' | 函数调用 | 常量 | 变量
 * ===================================================================== */

const D2R = Math.PI / 180, R2D = 180 / Math.PI;

/* 内置函数表：f 接收参数数组和求值上下文 */
const FUNCS = {
  sin : {f:(v,c)=>Math.sin(c.deg ? v[0]*D2R : v[0])},
  cos : {f:(v,c)=>Math.cos(c.deg ? v[0]*D2R : v[0])},
  tan : {f:(v,c)=>Math.tan(c.deg ? v[0]*D2R : v[0])},
  cot : {f:(v,c)=>1/Math.tan(c.deg ? v[0]*D2R : v[0])},
  sec : {f:(v,c)=>1/Math.cos(c.deg ? v[0]*D2R : v[0])},
  csc : {f:(v,c)=>1/Math.sin(c.deg ? v[0]*D2R : v[0])},
  asin:{f:(v,c)=>{const r=Math.asin(v[0]); return c.deg ? r*R2D : r}},
  acos:{f:(v,c)=>{const r=Math.acos(v[0]); return c.deg ? r*R2D : r}},
  atan:{f:(v,c)=>{const r=Math.atan(v[0]); return c.deg ? r*R2D : r}},
  sinh:{f:v=>Math.sinh(v[0])}, cosh:{f:v=>Math.cosh(v[0])}, tanh:{f:v=>Math.tanh(v[0])},
  asinh:{f:v=>Math.asinh(v[0])}, acosh:{f:v=>Math.acosh(v[0])}, atanh:{f:v=>Math.atanh(v[0])},
  sqrt:{f:v=>Math.sqrt(v[0])}, cbrt:{f:v=>Math.cbrt(v[0])},
  abs:{f:v=>Math.abs(v[0])}, sign:{f:v=>Math.sign(v[0])},
  floor:{f:v=>Math.floor(v[0])}, ceil:{f:v=>Math.ceil(v[0])}, round:{f:v=>Math.round(v[0])},
  ln:{f:v=>Math.log(v[0])}, log:{f:v=>Math.log10(v[0])}, log2:{f:v=>Math.log2(v[0])},
  lg:{f:v=>Math.log10(v[0])},
  exp:{f:v=>Math.exp(v[0])},
  min:{f:v=>Math.min(...v), min:1, max:99},
  max:{f:v=>Math.max(...v), min:1, max:99},
  pow:{f:v=>Math.pow(v[0],v[1]), min:2, max:2},
  atan2:{f:v=>Math.atan2(v[0],v[1]), min:2, max:2},
  mod:{f:v=>((v[0]%v[1])+v[1])%v[1], min:2, max:2},
};

function tokenize(src){
  const T = [], n = src.length;
  let i = 0;
  const isD = ch => ch >= '0' && ch <= '9';
  const isId = ch => /[A-Za-z]/.test(ch);
  while(i < n){
    const ch = src[i];
    if(ch === ' ' || ch === '\t' || ch === ' '){ i++; continue; }
    if(ch === 'π'){ T.push({t:'id', v:'π'}); i++; continue; }
    if(isD(ch) || ch === '.'){
      let j = i;
      while(j < n && (isD(src[j]) || src[j] === '.')) j++;
      const s = src.slice(i, j);
      if(s.split('.').length > 2 || s === '.') throw new Error('数字格式错误');
      T.push({t:'num', v:parseFloat(s)});
      i = j; continue;
    }
    if(isId(ch)){
      let j = i;
      while(j < n && isId(src[j])) j++;
      T.push({t:'id', v:src.slice(i, j)});
      i = j; continue;
    }
    const op = {'+':'+','-':'-','−':'-','*':'*','×':'*','/':'/','÷':'/',
                '^':'^','%':'%','(':'(',')':')',',':',','√':'√'}[ch];
    if(op){ T.push({t:'op', v:op}); i++; continue; }
    throw new Error('无法识别的字符 "' + ch + '"');
  }
  return T;
}

function parse(src){
  const T = tokenize(src);
  let p = 0;
  const isOp = v => p < T.length && T[p].t === 'op' && T[p].v === v;

  function parseAdd(){
    let n = parseTerm();
    while(isOp('+') || isOp('-')){
      const op = T[p++].v;
      n = {type: op === '+' ? 'add' : 'sub', l:n, r:parseTerm()};
    }
    return n;
  }
  function parseTerm(){
    let n = parseUnary();
    for(;;){
      const t = T[p];
      if(!t) break;
      if(t.t === 'op' && (t.v === '*' || t.v === '/')){
        p++;
        n = {type: t.v === '*' ? 'mul' : 'div', l:n, r:parseUnary()};
      }else if(t.t === 'num' || t.t === 'id' || (t.t === 'op' && (t.v === '(' || t.v === '√'))){
        n = {type:'mul', l:n, r:parseUnary()};   // 隐式乘法
      }else break;
    }
    return n;
  }
  function parseUnary(){
    if(isOp('-')){
      p++;
      return {type:'neg', a:parseUnary()};
    }
    if(isOp('+')){
      p++;
      return parseUnary();
    }
    if(isOp('√')){
      p++;
      return {type:'call', name:'sqrt', args:[parseUnary()]};
    }
    return parsePower();
  }
  function parsePower(){
    const base = parsePostfix();
    if(isOp('^')){
      p++;
      return {type:'pow', l:base, r:parseUnary()};   // 右结合，指数可为负数
    }
    return base;
  }
  function parsePostfix(){
    let n = parseAtom();
    while(isOp('%')){
      p++;
      n = {type:'pct', a:n};
    }
    return n;
  }
  function parseAtom(){
    if(p >= T.length) throw new Error('表达式不完整');
    const t = T[p++];
    if(t.t === 'num') return {type:'num', value:t.v};
    if(t.t === 'op' && t.v === '('){
      const n = parseAdd();
      if(!isOp(')')) throw new Error('缺少右括号 )');
      p++;
      return n;
    }
    if(t.t === 'id'){
      const name = t.v, lower = name.toLowerCase();
      if(name === 'π' || lower === 'pi') return {type:'const', name:'pi'};
      if(lower === 'e')   return {type:'const', name:'e'};
      if(name === 'x' || name === 'X') return {type:'x'};
      if(lower === 'ans') return {type:'ans'};
      const fn = FUNCS[lower];
      if(fn){
        if(!isOp('(')) throw new Error(lower + ' 后需要括号，如 ' + lower + '(x)');
        p++;
        const args = [parseAdd()];
        while(isOp(',')){ p++; args.push(parseAdd()); }
        if(!isOp(')')) throw new Error('缺少右括号 )');
        p++;
        if(args.length < (fn.min || 1) || args.length > (fn.max || 1))
          throw new Error(lower + ' 的参数个数不正确');
        return {type:'call', name:lower, args};
      }
      throw new Error('未知符号 "' + name + '"');
    }
    throw new Error('意外的 "' + t.v + '"');
  }

  const ast = parseAdd();
  if(p < T.length) throw new Error('多余的内容 "' + T[p].v + '"');
  return compile(ast);
}

/* AST → 求值闭包 fn(ctx)，ctx = { x, ans, deg } */
function compile(node){
  switch(node.type){
    case 'num':   { const v = node.value;        return () => v; }
    case 'const': { const v = node.name==='pi' ? Math.PI : Math.E; return () => v; }
    case 'x':     return c => c.x;
    case 'ans':   return c => c.ans;
    case 'neg':   { const a = compile(node.a);   return c => -a(c); }
    case 'pct':   { const a = compile(node.a);   return c => a(c) / 100; }
    case 'add':   { const l=compile(node.l), r=compile(node.r); return c => l(c) + r(c); }
    case 'sub':   { const l=compile(node.l), r=compile(node.r); return c => l(c) - r(c); }
    case 'mul':   { const l=compile(node.l), r=compile(node.r); return c => l(c) * r(c); }
    case 'div':   { const l=compile(node.l), r=compile(node.r); return c => l(c) / r(c); }
    case 'pow':   { const l=compile(node.l), r=compile(node.r); return c => Math.pow(l(c), r(c)); }
    case 'call': {
      const fn = FUNCS[node.name], args = node.args.map(compile);
      return c => fn.f(args.map(f => f(c)), c);
    }
  }
}

/* ---------- 数字格式化 ---------- */
function fmt(v, prec){
  prec = prec || 12;
  if(typeof v !== 'number' || Number.isNaN(v)) return '错误';
  if(!isFinite(v)) return v > 0 ? '∞' : '-∞';
  if(Object.is(v, -0)) v = 0;
  const a = Math.abs(v);
  if(a !== 0 && (a >= 1e12 || a < 1e-9)){
    const ex = Math.floor(Math.log10(a));
    return parseFloat((v / Math.pow(10, ex)).toPrecision(10)) + '×10^' + ex;
  }
  if(a < 1){
    return parseFloat(v.toFixed(Math.min(12, prec))).toString();
  }
  return String(parseFloat(v.toPrecision(prec)));
}

/* =====================================================================
 * 计算器模块
 * ===================================================================== */
const calc = { expr:'', ans:0, deg:true, justEq:false };
const exprEl = document.getElementById('expr');
const resultEl = document.getElementById('result');

const KEYS = [
  {l:'C',   cls:'fn warn', act:'clear'},
  {l:'⌫',   cls:'fn',       act:'back'},
  {l:'(',   cls:'fn',       ins:'('},
  {l:')',   cls:'fn',       ins:')'},
  {l:'÷',   cls:'op',       ins:'÷'},
  {l:'sin', cls:'fn',       ins:'sin('},
  {l:'cos', cls:'fn',       ins:'cos('},
  {l:'tan', cls:'fn',       ins:'tan('},
  {l:'^',   cls:'op',       ins:'^'},
  {l:'×',   cls:'op',       ins:'×'},
  {l:'ln',  cls:'fn',       ins:'ln('},
  {l:'log', cls:'fn',       ins:'log('},
  {l:'√',   cls:'fn',       ins:'√('},
  {l:'π',   cls:'fn',       ins:'π'},
  {l:'−',   cls:'op',       ins:'−'},
  {l:'7', ins:'7'}, {l:'8', ins:'8'}, {l:'9', ins:'9'},
  {l:'Ans', cls:'fn',       ins:'Ans'},
  {l:'+',   cls:'op',       ins:'+'},
  {l:'4', ins:'4'}, {l:'5', ins:'5'}, {l:'6', ins:'6'},
  {l:'%',   cls:'fn',       ins:'%'},
  {l:'=',   cls:'eq',       act:'eq'},
  {l:'1', ins:'1'}, {l:'2', ins:'2'}, {l:'3', ins:'3'},
  {l:'0', ins:'0'}, {l:'.', ins:'.'},
  {l:'DEG / RAD', cls:'unit', act:'deg'},
];

function buildKeys(){
  const box = document.getElementById('keys');
  KEYS.forEach(k => {
    const b = document.createElement('button');
    b.className = 'key' + (k.cls ? ' ' + k.cls : '');
    b.textContent = k.l;
    b.addEventListener('click', () => {
      if(k.ins !== undefined) insert(k.ins);
      else if(k.act === 'eq')   pressEq();
      else if(k.act === 'clear') clearAll();
      else if(k.act === 'back'){ backspace(); refresh(); }
      else if(k.act === 'deg'){ calc.deg = !calc.deg; refresh(); }
    });
    box.appendChild(b);
  });
}

const OP_KEYS = ['+','−','×','÷','^','%'];
const MULTI = ['sinh(','cosh(','tanh(','asin(','acos(','atan(','sqrt(','cbrt(',
               'sin(','cos(','tan(','ln(','log(','√(','Ans']
  .sort((a,b) => b.length - a.length);

function insert(v){
  if(calc.justEq){ calc.expr = OP_KEYS.includes(v) ? 'Ans' : ''; calc.justEq = false; }
  calc.expr += v;
  refresh();
}
function backspace(){
  for(const m of MULTI){
    if(calc.expr.endsWith(m)){ calc.expr = calc.expr.slice(0, -m.length); return; }
  }
  calc.expr = calc.expr.slice(0, -1);
}
function clearAll(){ calc.expr = ''; calc.justEq = false; refresh(); }

function refresh(){
  exprEl.textContent = calc.expr;
  if(!calc.expr){ resultEl.className = 'result'; resultEl.textContent = '0'; return; }
  try{
    const v = parse(calc.expr)({x:0, ans:calc.ans, deg:calc.deg});
    if(typeof v === 'number' && !Number.isNaN(v)){
      resultEl.className = 'result preview';
      resultEl.textContent = fmt(v);
    }else{
      resultEl.className = 'result preview';
      resultEl.textContent = '…';
    }
  }catch(e){
    resultEl.className = 'result preview';
    resultEl.textContent = '…';
  }
}

function pressEq(){
  if(!calc.expr) return;
  try{
    const v = parse(calc.expr)({x:0, ans:calc.ans, deg:calc.deg});
    if(typeof v !== 'number' || Number.isNaN(v)) throw new Error('结果无意义');
    calc.ans = v;
    exprEl.textContent = calc.expr + ' =';
    resultEl.className = 'result';
    resultEl.textContent = fmt(v);
    calc.expr = isFinite(v) ? fmt(v) : 'Ans';
    calc.justEq = true;
  }catch(err){
    resultEl.className = 'result error';
    resultEl.textContent = err.message;
  }
}

/* 键盘输入（仅当计算器页签激活且焦点不在输入框内） */
window.addEventListener('keydown', e => {
  if(!document.getElementById('calc').classList.contains('active')) return;
  const ae = document.activeElement;
  if(ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName)) return;
  const k = e.key;
  if(/^[0-9.]$/.test(k)) insert(k);
  else if(k === '+') insert('+');
  else if(k === '-') insert('−');
  else if(k === '*') insert('×');
  else if(k === '/'){ e.preventDefault(); insert('÷'); }
  else if(k === '^') insert('^');
  else if(k === '(' || k === ')') insert(k);
  else if(k === '%') insert('%');
  else if(k === 'Enter' || k === '='){ e.preventDefault(); pressEq(); }
  else if(k === 'Backspace'){ if(calc.justEq){ calc.justEq=false; calc.expr=''; } backspace(); refresh(); }
  else if(k === 'Escape') clearAll();
});

/* =====================================================================
 * 函数绘图模块
 * ===================================================================== */
const PALETTE = ['#5b8cff','#ff6b6b','#3ecf8e','#f5b84b','#b06ef7','#4fd2f7'];
const GRID   = 'rgba(148,172,220,0.08)';
const AXIS   = 'rgba(175,195,235,0.5)';
const LABEL  = 'rgba(165,185,225,0.62)';

const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const tip  = document.getElementById('tip');

const plot = {
  funcs: [],
  view: {xmin:-8, xmax:8, ymin:-4.5, ymax:4.5},
  w:0, h:0,
  trace: null,
};
let nextId = 0, plotInit = false;

function nextColor(){
  for(const c of PALETTE){
    if(!plot.funcs.some(f => f.color === c)) return c;
  }
  return PALETTE[0];
}
function compileFn(f){
  if(!f.expr.trim()){ f.fn = null; f.error = null; return; }
  try{ f.fn = parse(f.expr); f.error = null; }
  catch(e){ f.fn = null; f.error = e.message; }
}
function addFn(expr){
  if(plot.funcs.length >= PALETTE.length) return;
  const f = { id:nextId++, expr:expr||'', color:nextColor(), fn:null, error:null };
  compileFn(f);
  plot.funcs.push(f);
  renderFnList();
  draw();
}
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderFnList(){
  const listEl = document.getElementById('fnList');
  listEl.innerHTML = '';
  plot.funcs.forEach(f => {
    const item = document.createElement('div');
    item.className = 'fn-item';

    const row = document.createElement('div');
    row.className = 'fn-row';

    const dot = document.createElement('span');
    dot.className = 'dot'; dot.style.background = f.color;

    const eq = document.createElement('span');
    eq.className = 'fn-eq'; eq.textContent = 'y =';

    const inp = document.createElement('input');
    inp.value = f.expr; inp.placeholder = '例如 sin(x)'; inp.spellcheck = false;

    const err = document.createElement('div');
    err.className = 'fn-err';

    inp.addEventListener('input', () => {
      f.expr = inp.value; compileFn(f);
      inp.classList.toggle('invalid', !!f.error);
      err.textContent = f.error || '';
      err.style.display = f.error ? 'block' : 'none';
      draw();
    });

    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.title = '删除';
    del.addEventListener('click', () => {
      plot.funcs = plot.funcs.filter(g => g.id !== f.id);
      plot.trace = null;
      renderFnList(); draw();
    });

    row.append(dot, eq, inp, del);
    item.append(row, err);
    listEl.appendChild(item);

    inp.classList.toggle('invalid', !!f.error);
    if(f.error){ err.textContent = f.error; err.style.display = 'block'; }
  });
  document.getElementById('addFn').disabled = plot.funcs.length >= PALETTE.length;
}

/* ---------- 画布与坐标 ---------- */
function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const r = wrap.getBoundingClientRect();
  plot.w = Math.max(50, r.width);
  plot.h = Math.max(50, r.height);
  cv.width  = Math.round(plot.w * dpr);
  cv.height = Math.round(plot.h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function resetView(){
  const aspect = plot.h / plot.w || 0.6;
  const xr = 16, yr = xr * aspect;
  plot.view = {xmin:-8, xmax:8, ymin:-yr/2, ymax:yr/2};
}
function niceStep(raw){
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}
function fmtTick(v, step){
  if(Math.abs(v) < step / 1e6) return '0';
  const a = Math.abs(v);
  if(a >= 1e6 || a < 1e-4) return v.toExponential(1).replace('e+','e');
  const d = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
  return d === 0 ? String(Math.round(v)) : v.toFixed(d);
}

/* ---------- 绘制 ---------- */
function draw(){
  const {w, h} = plot;
  if(w < 50 || h < 50) return;
  const v = plot.view;
  const X = x => (x - v.xmin) / (v.xmax - v.xmin) * w;
  const Y = y => (v.ymax - y) / (v.ymax - v.ymin) * h;

  ctx.clearRect(0, 0, w, h);
  ctx.font = '11px Consolas,Menlo,monospace';

  const sx = niceStep((v.xmax - v.xmin) / (w / 90));
  const sy = niceStep((v.ymax - v.ymin) / (h / 70));

  /* 网格 */
  ctx.lineWidth = 1;
  ctx.strokeStyle = GRID;
  const xAxisY = Math.min(Math.max(Y(0), 0), h);
  const labY   = Math.min(Math.max(xAxisY + 7, 6), h - 16);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  let k0 = Math.ceil(v.xmin / sx), k1 = Math.floor(v.xmax / sx);
  for(let k = k0; k <= k1 && k - k0 < 400; k++){
    const px = X(k * sx);
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
    ctx.fillStyle = LABEL;
    ctx.fillText(fmtTick(k * sx, sx), px, labY);
  }
  const yAxisX = Math.min(Math.max(X(0), 0), w);
  const labX   = Math.min(Math.max(yAxisX - 6, 40), w - 8);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  k0 = Math.ceil(v.ymin / sy); k1 = Math.floor(v.ymax / sy);
  for(let k = k0; k <= k1 && k - k0 < 400; k++){
    const gy = k * sy;
    if(Math.abs(gy) < sy / 2) continue;   // 0 由 x 轴显示
    const py = Y(gy);
    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(w, py); ctx.stroke();
    ctx.fillStyle = LABEL;
    ctx.fillText(fmtTick(gy, sy), labX, py);
  }

  /* 坐标轴 */
  ctx.strokeStyle = AXIS; ctx.lineWidth = 1.4;
  if(v.ymin < 0 && v.ymax > 0){ const y0 = Y(0); ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(w,y0); ctx.stroke(); }
  if(v.xmin < 0 && v.xmax > 0){ const x0 = X(0); ctx.beginPath(); ctx.moveTo(x0,0); ctx.lineTo(x0,h); ctx.stroke(); }

  /* 函数曲线 */
  const env = {deg:false, ans:calc.ans};
  for(const f of plot.funcs){
    if(!f.fn) continue;
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 2.2;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    const N = Math.min(5000, Math.max(300, Math.ceil(w * 2)));
    let pen = false, prevPy = 0;
    for(let i = 0; i <= N; i++){
      const x = v.xmin + (v.xmax - v.xmin) * i / N;
      let y;
      try{ y = f.fn({x, ans:calc.ans, deg:false}); }catch(_){ y = NaN; }
      if(!isFinite(y)){ pen = false; continue; }
      const py = Math.max(-h * 2, Math.min(h * 3, Y(y)));
      const px = X(x);
      if(!pen){ ctx.moveTo(px, py); pen = true; }
      else if(Math.abs(py - prevPy) > h * 1.5){ ctx.moveTo(px, py); }  // 间断（如 tan）断开
      else ctx.lineTo(px, py);
      prevPy = py;
    }
    ctx.stroke();
  }

  /* 悬停追踪 */
  if(plot.trace){
    const t = plot.trace, px = X(t.wx);
    ctx.save();
    ctx.strokeStyle = 'rgba(165,185,225,.35)';
    ctx.setLineDash([4,4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
    ctx.restore();

    ctx.beginPath(); ctx.arc(px, t.sy, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = t.f.color; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();

    tip.style.display = 'block';
    tip.innerHTML =
      '<span style="color:' + t.f.color + '">●</span> y = ' + esc(t.f.expr) +
      '<br>x = ' + fmt(t.wx, 8) + '<br>y = ' + fmt(t.y, 8);
    let tx = t.mx + 16, ty = t.my + 16;
    if(tx + tip.offsetWidth  > w - 8)  tx = t.mx - tip.offsetWidth  - 12;
    if(ty + tip.offsetHeight > h - 8)  ty = t.my - tip.offsetHeight - 12;
    tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
  }else{
    tip.style.display = 'none';
  }
}

/* ---------- 平移 / 缩放 / 追踪 ---------- */
function pan(dx, dy){
  const v = plot.view;
  const ux = (v.xmax - v.xmin) / plot.w, uy = (v.ymax - v.ymin) / plot.h;
  v.xmin -= dx * ux; v.xmax -= dx * ux;
  v.ymin += dy * uy; v.ymax += dy * uy;
}
function zoomAt(mx, my, factor){
  const v = plot.view;
  const nr = (v.xmax - v.xmin) * factor;
  if(nr < 1e-10 || nr > 1e12) return;
  const wx = v.xmin + mx / plot.w * (v.xmax - v.xmin);
  const wy = v.ymax - my / plot.h * (v.ymax - v.ymin);
  v.xmin = wx - (wx - v.xmin) * factor;
  v.xmax = wx + (v.xmax - wx) * factor;
  v.ymin = wy - (wy - v.ymin) * factor;
  v.ymax = wy + (v.ymax - wy) * factor;
}
function updateTrace(mx, my){
  const v = plot.view;
  const wx = v.xmin + mx / plot.w * (v.xmax - v.xmin);
  let best = null;
  for(const f of plot.funcs){
    if(!f.fn) continue;
    let y;
    try{ y = f.fn({x:wx, ans:calc.ans, deg:false}); }catch(_){ continue; }
    if(!isFinite(y)) continue;
    const sy = (v.ymax - y) / (v.ymax - v.ymin) * plot.h;
    const d = Math.abs(sy - my);
    if(!best || d < best.d) best = {d, f, y, sy};
  }
  plot.trace = (best && best.d < 48) ? {wx, f:best.f, y:best.y, sy:best.sy, mx, my} : null;
  draw();
}

const pointers = new Map();
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  plot.trace = null; tip.style.display = 'none';
  cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  if(pointers.has(e.pointerId)){
    const prev = pointers.get(e.pointerId);
    if(pointers.size === 1){
      pan(e.clientX - prev.x, e.clientY - prev.y);
    }else if(pointers.size === 2){
      const otherId = [...pointers.keys()].find(id => id !== e.pointerId);
      const o = pointers.get(otherId);
      const od = Math.hypot(prev.x - o.x, prev.y - o.y);
      const nd = Math.hypot(e.clientX - o.x, e.clientY - o.y);
      const ncx = (e.clientX + o.x) / 2 - r.left, ncy = (e.clientY + o.y) / 2 - r.top;
      const ocx = (prev.x + o.x) / 2 - r.left, ocy = (prev.y + o.y) / 2 - r.top;
      if(od > 0) zoomAt(ncx, ncy, od / nd);
      pan(ncx - ocx, ncy - ocy);
    }
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    draw();
  }else if(e.pointerType === 'mouse'){
    updateTrace(e.clientX - r.left, e.clientY - r.top);
  }
});
function endPointer(e){ pointers.delete(e.pointerId); cv.style.cursor = 'crosshair'; }
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', () => {
  if(!pointers.size){ plot.trace = null; tip.style.display = 'none'; draw(); }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  plot.trace = null;
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.pow(1.0016, e.deltaY));
  draw();
}, {passive:false});
cv.addEventListener('dblclick', () => { resetView(); draw(); });

document.getElementById('resetView').addEventListener('click', () => { resetView(); draw(); });
document.getElementById('zoomIn').addEventListener('click', () => { zoomAt(plot.w/2, plot.h/2, 0.7); draw(); });
document.getElementById('zoomOut').addEventListener('click', () => { zoomAt(plot.w/2, plot.h/2, 1/0.7); draw(); });
document.getElementById('addFn').addEventListener('click', () => addFn(''));

/* 示例 */
const EXAMPLES = ['sin(x)','x^2','x^3-3x','e^(-x^2)','1/x','tan(x)','sqrt(x)','ln(x)','abs(x)','sin(x)/x'];
EXAMPLES.forEach(ex => {
  const c = document.createElement('button');
  c.className = 'chip'; c.textContent = ex;
  c.addEventListener('click', () => addFn(ex));
  document.getElementById('chips').appendChild(c);
});

/* ---------- 页签切换 ---------- */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === btn.dataset.tab));
    if(btn.dataset.tab === 'plot'){
      requestAnimationFrame(() => {
        if(!plotInit && wrap.getBoundingClientRect().width > 0){
          plotInit = true;
          resizeCanvas(); resetView(); draw();
        }
      });
    }
  });
});

new ResizeObserver(() => {
  if(wrap.getBoundingClientRect().width === 0) return;
  resizeCanvas();
  if(!plotInit){ plotInit = true; resetView(); }
  draw();
}).observe(wrap);

/* ---------- 启动 ---------- */
buildKeys();
refresh();
addFn('sin(x)');
addFn('x^2');
</script>
